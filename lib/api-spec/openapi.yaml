openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: manara
    description: Tarot Manara card catalog and interpretation
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /manara/cards:
    get:
      operationId: getManaraCards
      tags: [manara]
      summary: Get the 78-card Manara catalog
      responses:
        "200":
          description: Card catalog
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ManaraCard"
  /manara/readings:
    post:
      operationId: createManaraReading
      tags: [manara]
      summary: Generate a contextual interpretation of a Manara spread
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManaraReadingInput"
      responses:
        "200":
          description: Structured interpretation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManaraReading"
        "400":
          description: Invalid question or card selection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: The interpretation service could not produce a valid reading
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ApiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    ManaraCard:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        arcana:
          type: string
          enum: [major, minor]
        suit:
          type: string
          enum: [major, water, air, fire, earth]
        rank:
          type: integer
        keywords:
          type: array
          items:
            type: string
        meaning:
          type: string
        shadow:
          type: string
        imageUrl:
          type: ["string", "null"]
      required:
        - id
        - name
        - arcana
        - suit
        - rank
        - keywords
        - meaning
        - shadow
        - imageUrl
    ManaraReadingInput:
      type: object
      properties:
        question:
          type: string
          minLength: 8
          maxLength: 3000
        querentGender:
          type: string
          enum: [woman, man, not_specified]
        mode:
          type: string
          enum: [detailed, psychological]
        cardIds:
          type: array
          minItems: 1
          maxItems: 12
          items:
            type: string
      required:
        - question
        - querentGender
        - mode
        - cardIds
    ManaraCardAnalysis:
      type: object
      properties:
        cardId:
          type: string
        cardName:
          type: string
        position:
          type: integer
        interpretation:
          type: string
        connectionToQuestion:
          type: string
      required:
        - cardId
        - cardName
        - position
        - interpretation
        - connectionToQuestion
    ManaraReading:
      type: object
      properties:
        overview:
          type: string
        cardAnalysis:
          type: array
          items:
            $ref: "#/components/schemas/ManaraCardAnalysis"
        cardDynamics:
          type: string
        likelyAnswer:
          type: string
        alternativeReadings:
          type: array
          items:
            type: string
        reflectionQuestions:
          type: array
          items:
            type: string
      required:
        - overview
        - cardAnalysis
        - cardDynamics
        - likelyAnswer
        - alternativeReadings
        - reflectionQuestions

